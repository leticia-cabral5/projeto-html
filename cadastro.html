<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de cadastro</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
    <header>
        <h1>Página de cadastro</h1>
        <nav>
                <a href="sobre_mim.html">Sobre mim</a> <br>
                <a href="receitas.html">Receitas que gosto</a> <br>
                <a href="meus_hobbies.html">Meus hobbies e interesses</a> <br>
                <a href="contato.html">Entre em contato</a> <br>
                <a href="index.html">Volte para a página inicial.</a>
        </nav>
    </header>

    <form action="cadastro.html"></form>

    <label for="name">Nome</label>
    <input type="text" required> <br><br>

    <label for="email">Email</label>
    <input type="email" required><br><br>

    <label for="senha">Senha</label>
    <input type="password" minlength="8" required> <br><br>

    <label for="date">Data de nascimento</label>
    <input type="date" required><br><br>


    <label for="idade">Idade</label>
    <input type="number" required> <br><br>

    <label for="tel">Telefone</label>
    <input type="tel" required> <br><br>

    <p>Selecione seu gênero: </p>

    <input type="radio" name="genero" value="outro" required>
    <label for="outro">Outro</label>
    <input type="radio" name="genero" value="feminino">
    <label for="fem">Feminino</label>
    <input type="radio" name="genero" value="masculino">
    <label for="masc">Maculino</label><br><br>

    <p>Selecione seus interesses: </p>
    <input type="checkbox" name="interesse" value="leitura">
    <label for="leitura">Leitura</label>
    <input type="checkbox" name="interesse" value="música">
    <label for="musica">Música</label>
    <input type="checkbox" name="interesse" value="esporte">
    <label for="esporte">Esporte</label><br><br>

    <label for="cidade">Cidade:</label>
    <select name="cidade" id="cidade">
        <option value="timoteo">Timóteo</option>
        <option value="ipatinga">Ipatinga</option>
        <option value="fabriciano">Coronel Fabriciano</option>
    </select><br><br>

    <label style="display: block; margin-bottom: 5px;">
        Comentário Adicional:
    </label>
    <textarea style="width: 100%; max-width: 300px; height: 80px;"></textarea> <br><br>


    <button type="submit">Enviar formulário</button>
    <button type="reset">Limpar formulário</button>

   <footer>
    <p class="rodape">Letícia, 202 Informática - 2026</p>
   </footer>
</body>

</html>
