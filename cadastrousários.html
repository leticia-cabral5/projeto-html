<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastros</title>
<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

.container{
    max-width:500px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:8px;
}

h2{
    text-align:center;
}

.form-group{
    margin-bottom:12px;
}

label{
    display:block;
    margin-bottom:4px;
}

input, select{
    width:100%;
    padding:8px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:10px;
    background:#0066cc;
    color:white;
    border:none;
    cursor:pointer;
}

button:hover{
    background:#0052a3;
}

.msg{
    margin-top:10px;
    text-align:center;
    font-weight:bold;
}
</style>
</head>
<body>

<div class="container">

    <h2>Cadastro de Usuários da Escola</h2>

    <form id="cadastroForm">

        <div class="form-group">
            <label>Nome Completo</label>
            <input type="text" name="nome" required>
        </div>

        <div class="form-group">
            <label>E-mail</label>
            <input type="email" name="email" required>
        </div>

        <div class="form-group">
            <label>Telefone</label>
            <input type="tel" name="telefone" required>
        </div>

        <div class="form-group">
            <label>CPF</label>
            <input type="text" name="cpf" required>
        </div>

        <div class="form-group">
            <label>Data de Nascimento</label>
            <input type="date" name="nascimento" required>
        </div>


        <div class="form-group">
            <label>Função</label>
            <select name="funcao" required>
                <option value="">Selecione</option>
                <option value="Aluno">Aluno</option>
                <option value="Professor">Professor</option>
                <option value="Coordenador">Coordenador</option>
                <option value="Diretor">Diretor</option>
                <option value="Secretaria">Secretaria</option>
                <option value="Responsável">Responsável</option>
            </select>
        </div>

        <div class="form-group">
            <label>Nome de Usuário</label>
            <input type="text" name="user" required minlength="5" maxlength="20">
        </div>
        <div class="form-group">
            <label>Senha</label>
            <input type="password" name="senha" required>
        </div>

        <button type="submit">Cadastrar Usuário</button>

        <div class="msg" id="mensagem"></div>

    </form>

</div>


<script>
    const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbxVEoLkh2x-Y56Bxa_-fU_zIaDFtdLlFovFrIDhv1R0667_Xba5L-V1-GgBkm9NRdwCnw/exec";
    
    
    document.getElementById("cadastroForm")
    .addEventListener("submit", async function(e){
    
        e.preventDefault();
    
        const dados = new FormData(this);
    
    
        await fetch(URL_SCRIPT,{
            method:"POST",
            body:dados
        });
    
    
        document.getElementById("mensagem").innerHTML =
        "Cadastro salvo com sucesso!";
    
        this.reset();
</script>

});

</body>
</html>
